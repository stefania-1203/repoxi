<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPOXI.PF</title>
    <link rel="icon" type="image/jpeg" href="repoxi2.jpg">
    <link rel="shortcut icon" href="repoxi2.jpg">
    <link rel="apple-touch-icon" href="repoxi2.jpg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo"><img src="repoxi2.jpg" width="70" height="60"> R_EPOXI.PF</div> 
            <div class="user-status-bar">
                <span id="userEmailDisplay" class="user-email-display">Cargando sesión...</span>
                <button id="btnAuth" class="btn-verde" style="padding: 6px 12px; font-size:13px;" onclick="manejarAutenticacion()">Iniciar Sesión con Google</button>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1>Catálogo de Productos para Resina Epóxica</h1>
        <p>Explora nuestras piezas únicas en resina epóxica.</p>
    </section>

    <div class="container">

        <section id="galeria">
            <div class="seccion-header">
                <h2>Catálogo de Productos</h2>
                <button id="btnPublicarAcceso" class="btn-verde" style="display: none;" onclick="abrirFormularioPublicar()">+ Publicar Producto</button>
            </div>

            <div style="margin-bottom: 20px;">
                <input type="text" id="inputBuscador" placeholder="🔍 Buscar producto por nombre..." style="width: 100%; padding: 10px; border: 2px solid #0d47a1; border-radius: 6px; font-size: 15px;">
            </div>

            <div id="formularioPublicar" class="form-contenedor" style="display: none;">
                <form id="artForm">
                    <div class="form-grupo">
                        <label for="titulo">Nombre del producto o trabajo:</label>
                        <input type="text" id="titulo" required placeholder="Ej: Mesa de Río con Resina Azul">
                    </div>
                    <div class="form-grupo">
                       <label for="precio">Precio Base / Desde (€ EUR):</label>
                        <input type="number" id="precio" step="0.01" required placeholder="Ej: 25.00">
                    </div>

                    <!-- NUEVA SECCIÓN: VARIANTES -->
                    <div class="form-grupo">
                        <label style="font-weight: bold;">Variantes / Presentaciones (Opcional):</label>
                        <div id="contenedorVariantes"></div>
                        <button type="button" class="btn-amarillo" style="margin-top: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;" onclick="agregarCampoVariante()">+ Agregar Variante / Presentación</button>
                    </div>

                    <div class="form-grupo">
                        <label for="descripcion">Descripción y materiales:</label>
                        <textarea id="descripcion" rows="3" placeholder="Detalles de la pieza, dimensiones, acabados..."></textarea>
                    </div>
                    
                    <div class="form-grupo" style="margin-bottom:10px;">
                        <label for="whatsapp">WhatsApp (ej: 584121234567):</label>
                        <input type="text" id="whatsapp" placeholder="Ej: 584121234567">
                    </div>
                    <div class="form-grupo" style="margin-bottom:10px;">
                        <label for="instagram">Instagram (sin @):</label>
                        <input type="text" id="instagram" placeholder="Ej: mi_negocio">
                    </div>
                    <div class="form-grupo" style="margin-bottom:10px;">
                        <label for="facebook">Facebook:</label>
                        <input type="text" id="facebook" placeholder="Ej: mi.negocio">
                    </div>
                    <div class="form-grupo" style="margin-bottom:10px;">
                        <label for="tiktok">TikTok (sin @):</label>
                        <input type="text" id="tiktok" placeholder="Ej: mi_negocio">
                    </div>

                    <div class="form-grupo">
                        <label for="imagen">Foto del producto:</label>
                        <input type="file" id="imagen" accept="image/*" required style="padding:5px; display:block; margin-top:5px;">
                    </div>
                    <div class="form-botones">
                        <button type="submit" class="btn-verde">Subir al Catálogo</button>
                        <button type="button" class="btn-rojo" onclick="cerrarFormulario()">Cancelar</button>
                    </div>
                </form>
            </div>

            <div id="galeriaGrid" class="galeria-grid"></div>

        </section>
    </div>

    <button class="btn-carrito-flotante" onclick="abrirCarrito()">
        🛒 Carrito (<span id="cantCarrito">0</span>)
    </button>

    <div id="modalCarrito" class="modal-carrito">
        <div class="modal-carrito-contenido">
            <h2>🛒 Tu Carrito de Compras</h2>
            <div id="listaCarrito"></div>
            <h3 style="text-align: right; margin-top: 10px;">Total: €<span id="totalCarrito">0.00</span></h3>
            
            <hr>

            <h4>📋 Datos para Finalizar la Compra</h4>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <input type="text" id="clienteNombre" placeholder="Tu Nombre y Apellido" required style="padding: 8px;">
                <input type="text" id="clienteTelefono" placeholder="Tu WhatsApp (Ej: 584121234567)" required style="padding: 8px;">
                <textarea id="clienteDireccion" placeholder="Dirección de envío o detalles de entrega" style="padding: 8px;"></textarea>
            </div>

            <hr>

            <h4>💳 Datos de Pago</h4>
            <p id="infoPagoMovil" style="font-size: 13px; background: #f0f0f0; padding: 8px; border-radius: 4px;"></p>
            
            <label style="font-size: 13px; font-weight: bold;">Adjuntar comprobante o captura de pago:</label>
            <input type="file" id="comprobantePago" accept="image/*" style="margin-bottom: 15px;">

            <div style="display: flex; gap: 10px;">
                <button class="btn-verde" style="flex:1; padding: 10px;" onclick="procesarCompra()">Confirmar Compra</button>
                <button class="btn-rojo" style="padding: 10px;" onclick="cerrarCarrito()">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="miModal" class="modal">
        <div class="modal-contenido">
            <span class="modal-cerrar" onclick="cerrarModal()">&times;</span>
            <div class="modal-img-contenedor">
                <img id="modalImg" class="modal-img" src="" alt="">
            </div>
            <div class="modal-info" id="modalInfoCampos"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 R_EPOXI.PF. Todos los derechos reservados.</p>
    </footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBtaiW2KFCOEUOC0wJIijQWOoCbNdgBrTM",
    authDomain: "repoxi.firebaseapp.com",
    projectId: "repoxi",
    storageBucket: "repoxi.firebasestorage.app",
    messagingSenderId: "2765648803",
    appId: "1:2765648803:web:7bd2860c246e72fbfae016",
    measurementId: "G-PX26S1ZKEB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const ADMIN_EMAIL = "repoxi.pf@gmail.com"; 
  const PIN_ELIMINAR = "050325";
  const IMGBB_API_KEY = "1fe64fcd486e5ccc2e400bf8d6056a13"; 
  const DATOS_PAGO_MOBILE = "Pago Móvil: Banco Venezuela (0102) | Cedula: 11769334 | Tel: 0414-4137520";

  let misObras = [];
  let usuarioLogueado = null;
  let carrito = [];

  document.getElementById('infoPagoMovil').innerText = DATOS_PAGO_MOBILE;

  // --- MANEJO DE VARIANTES DINÁMICAS EN ADMIN ---
  window.agregarCampoVariante = function(nombre = '', precio = '') {
    const div = document.createElement('div');
    div.className = 'variante-item';
    div.innerHTML = `
      <input type="text" placeholder="Ej: Cuerina Pequeña 50 uds" value="${nombre}" class="var-nombre" style="flex:2;">
      <input type="number" step="0.01" placeholder="Precio €" value="${precio}" class="var-precio" style="flex:1;">
      <button type="button" class="btn-rojo" style="padding: 4px 8px; cursor: pointer;" onclick="this.parentElement.remove()">X</button>
    `;
    document.getElementById('contenedorVariantes').appendChild(div);
  };

  onAuthStateChanged(auth, (user) => {
    const display = document.getElementById('userEmailDisplay');
    const btnAuth = document.getElementById('btnAuth');
    const btnPublicar = document.getElementById('btnPublicarAcceso');

    if (user) {
      usuarioLogueado = user.email.toLowerCase();
      display.innerText = `Sesión: ${usuarioLogueado}`;
      btnAuth.innerText = "Cerrar Sesión";
      btnAuth.className = "btn-rojo";

      if (usuarioLogueado === ADMIN_EMAIL) {
        btnPublicar.style.display = 'inline-block';
      } else {
        btnPublicar.style.display = 'none';
        cerrarFormulario();
      }
    } else {
      usuarioLogueado = null;
      display.innerText = "Sin iniciar sesión";
      btnAuth.innerText = "Iniciar Sesión con Google";
      btnAuth.className = "btn-verde";
      btnPublicar.style.display = 'none';
      cerrarFormulario();
    }
    cargarGaleria();
  });

  window.manejarAutenticacion = async function() {
    if (auth.currentUser) {
      await signOut(auth);
      alert("Has cerrado sesión.");
    } else {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        alert("Error al iniciar sesión con Google: " + error.message);
      }
    }
  };

  window.abrirFormularioPublicar = function() {
    if (usuarioLogueado !== ADMIN_EMAIL) return;
    document.getElementById('formularioPublicar').style.display = 'block';
  };

  window.cerrarFormulario = function() {
    const el = document.getElementById('formularioPublicar');
    if (el) el.style.display = 'none';
  };

  function cargarGaleria() {
    const grid = document.getElementById('galeriaGrid');
    if (!grid) return;

    grid.innerHTML = ''; 
    const inputBuscador = document.getElementById('inputBuscador');
    const textoBusqueda = inputBuscador ? inputBuscador.value.toLowerCase().trim() : '';

    let productosOrdenados = [...misObras].sort((a, b) => {
      return (a.titulo || '').localeCompare(b.titulo || '', undefined, { sensitivity: 'base' });
    });

    if (textoBusqueda !== '') {
      productosOrdenados = productosOrdenados.filter(obra => 
        (obra.titulo && obra.titulo.toLowerCase().includes(textoBusqueda)) ||
        (obra.descripcion && obra.descripcion.toLowerCase().includes(textoBusqueda))
      );
    }

    if (productosOrdenados.length === 0) {
      grid.innerHTML = `<p style="color: #666; text-align: center; grid-column: 1/-1; padding: 20px;">No se encontraron productos.</p>`;
      return;
    }

    productosOrdenados.forEach((obra) => {
      const tarjeta = document.createElement('div');
      tarjeta.className = 'tarjeta-obra';
      tarjeta.innerHTML = `
        <div class="cuadro-imagen">
          <img src="${obra.imagen}" alt="${obra.titulo}" loading="lazy" decoding="async">
        </div>
        <div class="info-obra">
          <h2>${obra.titulo}</h2>
          <p><strong>Precio base:</strong> €${obra.precio || '0.00'}</p>
          <p style="white-space: pre-line;">${obra.descripcion ? obra.descripcion : "Sin descripción."}</p>
          <button class="btn-verde" style="margin-top:8px; width:100%;" onclick="abrirModal('${obra.id}')">🛒 Ver opciones / Comprar</button>
        </div>
      `;
      tarjeta.addEventListener('click', function(e) {
        if (!e.target.classList.contains('btn-verde')) {
          abrirModal(obra.id);
        }
      });
      grid.appendChild(tarjeta);
    });
  }

  // --- SELECCIÓN Y COMPRA DESDE EL MODAL CON VARIANTES ---
  window.agregarDesdeModal = function(id) {
    const producto = misObras.find(p => p.id === id);
    if (!producto) return;

    const cantidad = parseInt(document.getElementById('cantProductoModal').value) || 1;
    let nombreFinal = producto.titulo;
    let precioFinal = parseFloat(producto.precio || 0);

    const selectVar = document.getElementById('selectVarianteModal');
    if (selectVar && producto.variantes && producto.variantes[selectVar.value]) {
      const varianteSel = producto.variantes[selectVar.value];
      nombreFinal = `${producto.titulo} (${varianteSel.nombre})`;
      precioFinal = parseFloat(varianteSel.precio);
    }

    carrito.push({
      id: producto.id,
      titulo: nombreFinal,
      precio: precioFinal,
      cantidad: cantidad,
      subtotal: precioFinal * cantidad
    });

    actualizarCarritoUI();
    cerrarModal();
    alert(`¡${cantidad}x "${nombreFinal}" agregado(s) al carrito!`);
  };

  function actualizarCarritoUI() {
    const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
    document.getElementById('cantCarrito').innerText = totalItems;
    
    const lista = document.getElementById('listaCarrito');
    lista.innerHTML = '';

    let totalGeneral = 0;
    carrito.forEach((item, index) => {
      totalGeneral += item.subtotal;
      const div = document.createElement('div');
      div.className = 'item-carrito';
      div.innerHTML = `
        <div>
          <strong>${item.cantidad}x</strong> ${item.titulo}<br>
          <small>€${item.precio.toFixed(2)} c/u — Total: <strong>€${item.subtotal.toFixed(2)}</strong></small>
        </div>
        <button class="btn-rojo" style="padding: 2px 8px; font-size:12px; cursor:pointer;" onclick="quitarDelCarrito(${index})">X</button>
      `;
      lista.appendChild(div);
    });

    document.getElementById('totalCarrito').innerText = totalGeneral.toFixed(2);
  }

  window.quitarDelCarrito = function(index) {
    carrito.splice(index, 1);
    actualizarCarritoUI();
  };

  window.abrirCarrito = function() {
    document.getElementById('modalCarrito').style.display = 'flex';
  };

  window.cerrarCarrito = function() {
    document.getElementById('modalCarrito').style.display = 'none';
  };

  window.procesarCompra = async function() {
    if (carrito.length === 0) {
      alert("El carrito está vacío.");
      return;
    }

    const nombre = document.getElementById('clienteNombre').value.trim();
    const telefono = document.getElementById('clienteTelefono').value.trim();
    const direccion = document.getElementById('clienteDireccion').value.trim();
    const archivoComprobante = document.getElementById('comprobantePago').files[0];

    if (!nombre || !telefono) {
      alert("Por favor completa tu Nombre y WhatsApp.");
      return;
    }

    if (!archivoComprobante) {
      alert("Por favor adjunta la captura o comprobante de pago.");
      return;
    }

    const NUMERO_WHATSAPP_ADMIN = "584144137520";
    let urlComprobante = "No disponible";

    try {
      alert("Procesando tu compra... Se abrirá WhatsApp a continuación.");

      try {
        const formData = new FormData();
        formData.append("image", archivoComprobante);
        const resImg = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const datosImg = await resImg.json();
        if (datosImg && datosImg.data && datosImg.data.url) {
          urlComprobante = datosImg.data.url;
        }
      } catch (errImg) {
        console.warn("No se pudo subir la imagen a ImgBB:", errImg);
      }

      const total = document.getElementById('totalCarrito').innerText;
      const resumenProductos = carrito.map(p => `- ${p.cantidad}x ${p.titulo} (€${p.subtotal.toFixed(2)})`).join('\n');

      try {
        await addDoc(collection(db, "pedidos"), {
          cliente: nombre,
          telefono: telefono,
          direccion: direccion,
          productos: carrito,
          total: total,
          comprobanteUrl: urlComprobante,
          fecha: Date.now()
        });
      } catch (errDb) {
        console.warn("No se guardó en Firestore:", errDb);
      }

      const mensajeWA = `¡Hola! He realizado una compra en R_EPOXI.PF 🛍️\n\n` +
        `👤 *Cliente:* ${nombre}\n` +
        `📞 *Contacto:* ${telefono}\n` +
        `📍 *Dirección:* ${direccion}\n\n` +
        `🛒 *Pedido:*\n${resumenProductos}\n\n` +
        `💰 *Total:* €${total}\n` +
        `📄 *Comprobante de Pago:* ${urlComprobante}`;

      const urlWhatsApp = `https://wa.me/${NUMERO_WHATSAPP_ADMIN}?text=${encodeURIComponent(mensajeWA)}`;
      
      window.open(urlWhatsApp, '_blank');

      carrito = [];
      actualizarCarritoUI();
      cerrarCarrito();

    } catch (error) {
      console.error(error);
      alert("Ocurrió un detalle al procesar: " + error.message);
    }
  };

  onSnapshot(collection(db, "productos"), (snapshot) => {
    misObras = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    cargarGaleria();
  });

  const formArt = document.getElementById('artForm');
  if (formArt) {
    formArt.addEventListener('submit', async function(e) {
      e.preventDefault();
      if (usuarioLogueado !== ADMIN_EMAIL) return;

      const archivoImagen = document.getElementById('imagen').files[0];
      if (!archivoImagen) return;

      const variantes = [];
      document.querySelectorAll('#contenedorVariantes .variante-item').forEach(item => {
        const nom = item.querySelector('.var-nombre').value.trim();
        const prec = item.querySelector('.var-precio').value.trim();
        if (nom && prec) {
          variantes.push({ nombre: nom, precio: parseFloat(prec) });
        }
      });

      try {
        alert("Subiendo producto...");
        const formData = new FormData();
        formData.append("image", archivoImagen);
        const respuesta = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const datosNube = await respuesta.json();
        const urlPublicaDeLaFoto = datosNube.data.medium?.url || datosNube.data.display_url || datosNube.data.url;

        await addDoc(collection(db, "productos"), {
          titulo: document.getElementById('titulo').value,
          precio: document.getElementById('precio').value,
          descripcion: document.getElementById('descripcion').value,
          variantes: variantes,
          whatsapp: document.getElementById('whatsapp')?.value.replace(/[^0-9]/g, '') || '',
          instagram: document.getElementById('instagram')?.value.replace('@', '').trim() || '',
          facebook: document.getElementById('facebook')?.value.trim() || '',
          tiktok: document.getElementById('tiktok')?.value.replace('@', '').trim() || '',
          creador: usuarioLogueado, 
          imagen: urlPublicaDeLaFoto,
          fecha: Date.now()
        });

        document.getElementById('artForm').reset();
        document.getElementById('contenedorVariantes').innerHTML = '';
        cerrarFormulario();
        alert("¡Producto publicado con éxito!");
      } catch (error) {
        alert("Error al publicar el producto.");
      }
    });
  }

  // --- FUNCIONES DE ADMINISTRACIÓN: EDITAR Y ELIMINAR ---

  window.eliminarProducto = async function(id) {
    const pin = prompt("Introduce el PIN de seguridad para eliminar:");
    if (pin === PIN_ELIMINAR) {
      try {
        await deleteDoc(doc(db, "productos", id));
        cerrarModal();
        alert("Producto eliminado correctamente.");
      } catch (error) {
        console.error(error);
        alert("Error al intentar eliminar el producto.");
      }
    } else if (pin !== null) {
      alert("PIN incorrecto.");
    }
  };

  window.editarProducto = function(id) {
    const obra = misObras.find(o => o.id === id);
    if (!obra) return;

    const infoContenedor = document.getElementById('modalInfoCampos');
    
    infoContenedor.innerHTML = `
      <h3 style="margin-top:0; color:#1a365d;">Editar Producto</h3>
      
      <div style="display:flex; flex-direction:column; gap:10px; text-align:left;">
        <div>
          <label style="font-weight:bold; font-size:13px;">Nombre del producto:</label>
          <input type="text" id="editTitulo" value="${obra.titulo || ''}">
        </div>

        <div>
          <label style="font-weight:bold; font-size:13px;">Precio Base (€ EUR):</label>
          <input type="number" id="editPrecio" step="0.01" value="${obra.precio || ''}">
        </div>

        <div>
          <label style="font-weight:bold; font-size:13px; display:block; margin-bottom:5px;">Variantes / Presentaciones:</label>
          <div id="contenedorVariantesEdit"></div>
          <button type="button" class="btn-amarillo" style="margin-top: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;" onclick="agregarCampoVarianteEdit()">+ Agregar Variante</button>
        </div>

        <div>
          <label style="font-weight:bold; font-size:13px;">Descripción:</label>
          <textarea id="editDescripcion" style="height:70px;">${obra.descripcion || ''}</textarea>
        </div>

        <div>
          <label style="font-weight:bold; font-size:13px;">WhatsApp (solo números):</label>
          <input type="text" id="editWhatsapp" value="${obra.whatsapp || ''}">
        </div>

        <div>
          <label style="font-weight:bold; font-size:13px;">Instagram (usuario):</label>
          <input type="text" id="editInstagram" value="${obra.instagram || ''}">
        </div>

        <div>
          <label style="font-weight:bold; font-size:13px;">Facebook (usuario/página):</label>
          <input type="text" id="editFacebook" value="${obra.facebook || ''}">
        </div>

        <div>
          <label style="font-weight:bold; font-size:13px;">TikTok (usuario):</label>
          <input type="text" id="editTiktok" value="${obra.tiktok || ''}">
        </div>

        <div>
          <label style="font-weight:bold; font-size:13px;">Cambiar imagen (Opcional):</label>
          <input type="file" id="editImagen" accept="image/*" style="display:block; margin-top:5px;">
        </div>

        <div style="margin-top:15px; display:flex; gap:10px;">
          <button onclick="guardarCambiosProducto('${obra.id}')" style="background:#1b498a; color:white; border:none; padding:10px 16px; border-radius:4px; font-weight:bold; cursor:pointer;">Guardar Cambios</button>
          <button onclick="abrirModal('${obra.id}')" style="background:#dc3545; color:white; border:none; padding:10px 16px; border-radius:4px; font-weight:bold; cursor:pointer;">Cancelar</button>
        </div>
      </div>
    `;

    if (obra.variantes && obra.variantes.length > 0) {
      obra.variantes.forEach(v => agregarCampoVarianteEdit(v.nombre, v.precio));
    }
  };

  window.agregarCampoVarianteEdit = function(nombre = '', precio = '') {
    const div = document.createElement('div');
    div.className = 'variante-item-edit';
    div.style.cssText = 'display:flex; gap:5px; margin-bottom:5px;';
    div.innerHTML = `
      <input type="text" placeholder="Ej: Cuerina Pequeña 50 uds" value="${nombre}" class="var-nombre-edit" style="flex:2;">
      <input type="number" step="0.01" placeholder="Precio €" value="${precio}" class="var-precio-edit" style="flex:1;">
      <button type="button" class="btn-rojo" style="padding: 4px 8px; cursor: pointer;" onclick="this.parentElement.remove()">X</button>
    `;
    document.getElementById('contenedorVariantesEdit').appendChild(div);
  };

  window.guardarCambiosProducto = async function(id) {
    const obra = misObras.find(o => o.id === id);
    if (!obra) return;

    const nuevoTitulo = document.getElementById('editTitulo').value;
    const nuevoPrecio = document.getElementById('editPrecio').value;
    const nuevaDesc = document.getElementById('editDescripcion').value;
    const nuevoWhatsapp = document.getElementById('editWhatsapp').value.replace(/[^0-9]/g, '');
    const nuevoInstagram = document.getElementById('editInstagram').value.replace('@', '').trim();
    const nuevoFacebook = document.getElementById('editFacebook').value.trim();
    const nuevoTiktok = document.getElementById('editTiktok').value.replace('@', '').trim();
    const archivoNuevaImagen = document.getElementById('editImagen').files[0];

    const nuevasVariantes = [];
    document.querySelectorAll('.variante-item-edit').forEach(item => {
      const nom = item.querySelector('.var-nombre-edit').value.trim();
      const prec = item.querySelector('.var-precio-edit').value.trim();
      if (nom && prec) {
        nuevasVariantes.push({ nombre: nom, precio: parseFloat(prec) });
      }
    });

    try {
      let urlImagenFinal = obra.imagen;

      if (archivoNuevaImagen) {
        alert("Subiendo la nueva imagen... Por favor espera.");
        const formData = new FormData();
        formData.append("image", archivoNuevaImagen);

        const respuesta = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const datosNube = await respuesta.json();
        if (datosNube.success) {
          urlImagenFinal = datosNube.data.medium?.url || datosNube.data.display_url || datosNube.data.url;
        }
      }

      await updateDoc(doc(db, "productos", id), {
        titulo: nuevoTitulo,
        precio: nuevoPrecio,
        descripcion: nuevaDesc,
        variantes: nuevasVariantes,
        whatsapp: nuevoWhatsapp,
        instagram: nuevoInstagram,
        facebook: nuevoFacebook,
        tiktok: nuevoTiktok,
        imagen: urlImagenFinal
      });

      cerrarModal();
      alert("¡Producto actualizado correctamente!");

    } catch (error) {
      console.error(error);
      alert("Error al actualizar el producto.");
    }
  };

  window.abrirModal = function(id) {
    const obra = misObras.find(o => o.id === id);
    if (!obra) return;

    document.getElementById('modalImg').src = obra.imagen;
    mostrarVistaNormal(obra);
    document.getElementById('miModal').style.display = 'flex';
  };

  window.cerrarModal = function() {
    document.getElementById('miModal').style.display = 'none';
  };

  function mostrarVistaNormal(obra) {
    const infoContenedor = document.getElementById('modalInfoCampos');
    
    let variantesHTML = '';
    if (obra.variantes && obra.variantes.length > 0) {
      variantesHTML = `
        <div class="contenedor-variantes-modal">
          <label>Selecciona la presentación:</label>
          <select id="selectVarianteModal" class="select-variante">
            ${obra.variantes.map((v, i) => `<option value="${i}">${v.nombre} - €${v.precio.toFixed(2)}</option>`).join('')}
          </select>
        </div>
      `;
    }

    let selectorCantidad = `
      <div class="contenedor-cantidad-modal">
        <label style="font-weight:bold;">Cantidad:</label>
        <input type="number" id="cantProductoModal" value="1" min="1" class="input-cantidad">
      </div>
    `;

    let redesHTML = '<div class="modal-redes" style="margin-top:15px; display:flex; flex-direction:column; gap:8px;">';
    let tieneRedes = false;

    if (obra.whatsapp) {
      redesHTML += `<a href="https://wa.me/${obra.whatsapp}" target="_blank" style="color:#25D366; text-decoration:none; font-weight:bold;">📲 WhatsApp: +${obra.whatsapp}</a>`;
      tieneRedes = true;
    }
    if (obra.instagram) {
      redesHTML += `<a href="https://instagram.com/${obra.instagram}" target="_blank" style="color:#E1306C; text-decoration:none; font-weight:bold;">📸 Instagram: @${obra.instagram}</a>`;
      tieneRedes = true;
    }
    if (obra.facebook) {
      redesHTML += `<a href="https://facebook.com/${obra.facebook}" target="_blank" style="color:#4267B2; text-decoration:none; font-weight:bold;">📘 Facebook: ${obra.facebook}</a>`;
      tieneRedes = true;
    }
    if (obra.tiktok) {
      redesHTML += `<a href="https://tiktok.com/@${obra.tiktok}" target="_blank" style="color:#000; text-decoration:none; font-weight:bold;">🎵 TikTok: @${obra.tiktok}</a>`;
      tieneRedes = true;
    }
    redesHTML += '</div>';

    if (!tieneRedes) redesHTML = '';

    let adminBotones = '';
    if (usuarioLogueado === ADMIN_EMAIL) {
      adminBotones = `
        <div style="margin-top:20px; display:flex; gap:10px;">
          <button onclick="editarProducto('${obra.id}')" style="background:#f39c12; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;">Editar</button>
          <button onclick="eliminarProducto('${obra.id}')" style="background:#e74c3c; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;">Eliminar</button>
        </div>
      `;
    }

    infoContenedor.innerHTML = `
      <h2>${obra.titulo}</h2>
      <p><strong>Precio base:</strong> €${obra.precio || '0.00'}</p>
      <p style="white-space: pre-line;">${obra.descripcion ? obra.descripcion : "Sin descripción."}</p>
      ${variantesHTML}
      ${selectorCantidad}
      <button class="btn-verde" style="width:100%; padding:10px; font-size:15px; cursor:pointer;" onclick="agregarDesdeModal('${obra.id}')">🛒 Agregar al Carrito</button>
      ${redesHTML}
      ${adminBotones}
    `;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const inputBuscador = document.getElementById('inputBuscador');
    if (inputBuscador) {
      inputBuscador.addEventListener('input', cargarGaleria);
    }
  });

  cargarGaleria();
</script>
</body>
</html>
